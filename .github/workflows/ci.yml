name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install light test dependencies (no torch needed: tests use a simulated engine)
        run: pip install numpy pandas fastapi uvicorn httpx psutil pytest
      - run: python -m pytest -q
